[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse360-salesforce-data-cloud-mcp"
version = "0.1.0"
description = "Read-only Salesforce and Data Cloud MCP service for Pulse360 validation workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.26.0,<2",
]

[project.scripts]
pulse360-salesforce-data-cloud-mcp = "pulse360_salesforce_data_cloud_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

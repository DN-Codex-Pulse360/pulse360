<template>
    <div class="account-shell">
        <section class="account-header">
            <div class="header-copy">
                <p class="eyebrow">Altitude 3 · Salesforce Account Workspace</p>
                <h1 class="header-title">Pulse360 Account Workspace</h1>
                <p class="header-summary">Make the Account page the default daily-user operating surface: weighted summary, seller guidance, renewal risk, and trust cues in one place.</p>
                <div class="badge-row">
                    <span class="badge badge_soft">Account-centered execution</span>
                    <span class="badge badge_soft">Weighted summary</span>
                    <span class="badge badge_soft">Trust-first actions</span>
                </div>
            </div>

            <div class="header-actions">
                <template if:true={hasPortfolioLink}>
                    <lightning-button
                        label="Open portfolio dashboard"
                        variant="brand"
                        onclick={handleOpenPortfolioDashboard}>
                    </lightning-button>
                </template>
                <template if:true={hasGovernanceLink}>
                    <lightning-button
                        label="Open governance cases"
                        variant="neutral"
                        onclick={handleOpenGovernanceCases}>
                    </lightning-button>
                </template>
            </div>
        </section>

        <section class="account-layout">
            <div class="account-main">
                <c-pulse360-seller-workspace-v2
                    record-id={recordId}
                    embedded-mode="true">
                </c-pulse360-seller-workspace-v2>

                <template if:true={hasRenewalModule}>
                    <c-pulse360-renewal-risk-workspace
                        record-id={recordId}
                        embedded-mode="true">
                    </c-pulse360-renewal-risk-workspace>
                </template>
            </div>

            <aside class="account-rail">
                <section class="surface guidance-surface">
                    <p class="eyebrow">Workspace intent</p>
                    <h2 class="section-title">What this page should do</h2>
                    <div class="guidance-list">
                        <article class="guidance-item">
                            <div class="detail-label">Before the call</div>
                            <p>Show the seller what matters next without making them reconstruct hierarchy, whitespace, or trust context.</p>
                        </article>
                        <article class="guidance-item">
                            <div class="detail-label">During the call</div>
                            <p>Keep the account-level story anchored on the right entity, sponsor path, and commercially grounded next move.</p>
                        </article>
                        <article class="guidance-item">
                            <div class="detail-label">After the call</div>
                            <p>Convert the recommended move into tasks, opportunity creation, renewal intervention, or governance follow-up.</p>
                        </article>
                    </div>
                </section>

                <template if:true={hasHealthScan}>
                    <c-pulse360-health-scan record-id={recordId}></c-pulse360-health-scan>
                </template>
            </aside>
        </section>
    </div>
</template>

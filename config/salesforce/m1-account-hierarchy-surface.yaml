surface: Account_Record_Page
mode: source_first_design
status: planned
linear_scope: DAN-334
principles:
  - M1 hierarchy intelligence is read-only in CRM.
  - Account joins use Salesforce Account Ids, not sovereign or provider identifiers.
  - Group rollup values preserve coverage-gap state instead of forcing false precision.
  - Data Cloud setup remains runbook-controlled until M1 Direct Access stream metadata is available in source.
sections:
  - key: m1_hierarchy_activation
    label: M1 Hierarchy Activation
    region: main
    source_dmo: Pulse360_M1_Hierarchy_Activation__dlm
    join_key: source_account_id__c
    parent_key: Account.Id
    recommended_component: embedded_report_or_data_cloud_panel
    expected_rows: 18
    fields:
      - account_group_id__c
      - group_anchor_source_account_id__c
      - group_anchor_name__c
      - ultimate_parent_name__c
      - member_account_count__c
      - group_revenue_usd__c
      - hierarchy_completeness_score__c
      - coverage_gap_flag__c
      - coverage_gap_summary__c
      - confidence__c
      - generated_at__c
    editable: false
release_notes:
  - Do not change existing firmographic DMO relationships for M1.
  - Create only the M1 activation Direct Access stream first, then promote the activation report into the existing validation folder.
  - Keep M1 group rollup and hierarchy edge tables in Databricks until a Salesforce UX need proves they must become first-class Data Cloud objects.
  - Keep M1 dashboard separate until report metadata can be retrieved and validated.
